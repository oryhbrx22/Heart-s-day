<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:#111;min-height:100vh;display:flex;
  justify-content:center;align-items:center;
  background:#FFDAE9;overflow:auto;padding:24px
}
#envelopeStage{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  min-height:100vh;position:fixed;inset:0;z-index:10
}
body.show-modal .container{display:flex}
.container{
  display:none;flex-direction:column;text-align:center;
  background:white;padding:40px 36px;border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
  max-width:650px;min-height:520px;
  max-height:calc(100vh - 48px);
  overflow-y:auto;transition:.3s
}
.modal-inner{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center}
.modal-view{display:none;opacity:0;transition:.25s}
.modal-view.visible{display:block;opacity:1}

/* Envelope */
.envelope{
  position:relative;width:220px;height:160px;
  background:#f5e6d3;border-radius:4px;
  box-shadow:0 4px 20px rgba(0,0,0,0.12);
  cursor:pointer
}
.envelope-flap{
  position:absolute;inset:0;
  background:linear-gradient(165deg,#e8d5c4 0%,#d4c4a8 45%,#c9b89a 100%);
  clip-path:polygon(0 0,50% 50%,100% 0);
  transform-origin:top center;
  transition:.8s
}
.envelope.opening .envelope-flap{transform:rotateX(-170deg)}
.envelope-heart{
  position:absolute;top:57%;left:57%;
  transform:translate(-50%,-50%);
  font-size:28px;color:#c41e3a
}

/* Puzzle */
.modal-title{font-size:24px;margin:16px 0 32px}
.puzzle-container{
  width:40vh;max-width:100%;
  background:#f5f5f5;padding:10px;border-radius:12px
}
.puzzle-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:2px;width:100%;aspect-ratio:1
}
.puzzle-tile{
  background-size:cover;background-position:center;
  border-radius:8px;cursor:pointer
}
.puzzle-tile.empty{background:none;cursor:default}

.puzzle-reveal-text{opacity:0;transition:.4s;margin-top:20px}
.puzzle-reveal-text.show{opacity:1}

.yes-only-btn{
  font-size:20px;padding:12px 24px;
  background:#FFDAE9;border:none;
  border-radius:50px;cursor:pointer;
  font-weight:600;transition:.2s
}
.yes-only-btn:hover{transform:scale(1.05)}

.container--success{background:transparent;box-shadow:none}
.success-gif-wrap{margin:0 auto 24px;border-radius:12px;overflow:hidden;max-width:420px}
.success-gif-wrap img{width:100%}
.reset-btn{background:none;border:none;color:#666;text-decoration:underline;cursor:pointer}
</style>
</head>

<body>

<!-- ENVELOPE -->
<div id="envelopeStage">
  <div class="envelope" id="envelope">
    <div class="envelope-heart">❤️</div>
    <div class="envelope-flap"></div>
  </div>
</div>

<div class="container">
  <div class="modal-inner">

    <!-- PUZZLE VIEW -->
    <div id="puzzleView" class="modal-view">
      <h1 class="modal-title">Dear Regine...</h1>

      <div class="puzzle-container">
        <div class="puzzle-grid" id="puzzleGrid"></div>
      </div>

      <div class="puzzle-reveal-text" id="puzzleRevealText">
        <p>...you complete me.</p>
        <p><strong>Will you be my Valentine?</strong></p>
        <div style="display:flex;gap:12px;justify-content:center;margin-top:12px;">
          <button class="yes-only-btn" id="yesBtn">Yes</button>
          <button class="yes-only-btn" id="noBtn" style="background:#eee;">No</button>
        </div>
      </div>
    </div>

    <!-- SUCCESS VIEW -->
    <div id="successView" class="modal-view">
      <p class="modal-title">Yay, I can't wait!</p>
      <div class="success-gif-wrap">
        <img src="Yes.gif" alt="">
      </div>
      <button class="reset-btn" id="resetBtn">Reset</button>
    </div>

    <!-- NO VIEW -->
    <div id="noView" class="modal-view">
      <p class="modal-title">Aww... are you sure? 🥺</p>
      <div class="success-gif-wrap">
        <img id="noGif" src="no1.gif" alt="">
      </div>
      <p>The YES is still waiting for you 💖</p>
    </div>

  </div>
</div>

<script>
const envelope=document.getElementById('envelope');
const envelopeStage=document.getElementById('envelopeStage');
const puzzleGrid=document.getElementById('puzzleGrid');
const puzzleView=document.getElementById('puzzleView');
const successView=document.getElementById('successView');
const noView=document.getElementById('noView');
const container=document.querySelector('.container');

let noClickCount=0;
const noGifs=["no1.gif","no2.gif","no3.gif"];

/* ENVELOPE */
envelope.addEventListener('click',()=>{
  envelope.classList.add('opening');
  setTimeout(()=>{
    envelopeStage.style.display='none';
    document.body.classList.add('show-modal');
    puzzleView.classList.add('visible');
  },800);
});

/* SIMPLE PUZZLE AUTO COMPLETE */
for(let i=1;i<=9;i++){
  const tile=document.createElement('div');
  tile.className='puzzle-tile';
  tile.style.backgroundImage=`url('images/tile-${i}.png')`;
  puzzleGrid.appendChild(tile);
}
setTimeout(()=>document.getElementById('puzzleRevealText').classList.add('show'),1500);

/* YES */
document.getElementById('yesBtn').addEventListener('click',()=>{
  container.classList.add('container--success');
  puzzleView.classList.remove('visible');
  successView.classList.add('visible');
});

/* NO with 3 GIF stages */
document.getElementById('noBtn').addEventListener('click',()=>{
  noClickCount++;
  const noGif=document.getElementById("noGif");

  if(noClickCount<=noGifs.length){
    noGif.src=noGifs[noClickCount-1];
  }else{
    noGif.src=noGifs[noGifs.length-1];
  }

  puzzleView.classList.remove('visible');
  noView.classList.add('visible');

  setTimeout(()=>{
    noView.classList.remove('visible');
    puzzleView.classList.add('visible');
  },3000);
});

/* RESET */
document.getElementById('resetBtn').addEventListener('click',()=>{
  window.location.reload();
});
</script>

</body>
</html>
