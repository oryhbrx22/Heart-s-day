<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:#FFDAE9;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px;
}

/* Envelope Stage */
#envelopeStage{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:10;
}
.envelope{
    width:260px;height:180px;
    background:#f5e6d3;
    border-radius:6px;
    box-shadow:0 8px 24px rgba(0,0,0,.2);
    position:relative;
    cursor:pointer;
    transition:.2s;
}
.envelope:hover{transform:scale(1.05)}
.envelope-heart{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:48px;
    color:#c41e3a;
}
.envelope.opening{opacity:0;transform:scale(.9)}

/* Modal Container */
.container{
    display:none;
    background:white;
    padding:32px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    max-width:600px;
    width:100%;
    text-align:center;
}
body.show-modal .container{display:block}

.modal-view{display:none}
.modal-view.visible{display:block}

/* Puzzle */
.puzzle-container{max-width:300px;margin:0 auto 20px}
.puzzle-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:4px;
}
.puzzle-tile{
    width:100%;
    aspect-ratio:1;
    background-size:cover;
    background-position:center;
    border-radius:8px;
    cursor:pointer;
}
.puzzle-tile.empty{background:none;cursor:default}

.puzzle-reveal-text{opacity:0;transition:.3s}
.puzzle-reveal-text.show{opacity:1}

.yes-only-btn{
    font-size:18px;
    padding:10px 20px;
    border-radius:999px;
    border:1px solid rgba(0,0,0,.1);
    cursor:pointer;
    background:#FFDAE9;
    font-weight:600;
}
.yes-only-btn:hover{transform:scale(1.05)}

/* Success / No views */
.success-gif-wrap{
    max-width:360px;
    margin:0 auto 16px;
    border-radius:12px;
    overflow:hidden;
}
.success-gif-wrap img{width:100%;display:block}

.reset-btn{
    background:none;border:none;
    text-decoration:underline;
    cursor:pointer;color:#555;
}

/* Confetti */
.confetti{
    position:fixed;
    width:10px;height:10px;
    top:-10px;
    animation:fall 3s linear forwards;
}
@keyframes fall{
    to{transform:translateY(110vh) rotate(360deg);opacity:0}
}
</style>
</head>
<body>

<!-- ENVELOPE -->
<div id="envelopeStage">
    <div class="envelope" id="envelope">
        <div class="envelope-heart">❤️</div>
    </div>
</div>

<div class="container">
    <!-- PUZZLE VIEW -->
    <div id="puzzleView" class="modal-view">
        <h2>Dear Regine...</h2>

        <div class="puzzle-container">
            <div class="puzzle-grid" id="puzzleGrid"></div>
        </div>

        <div class="puzzle-reveal-text" id="puzzleRevealText">
            <p style="margin-bottom:8px;">...you complete me.</p>
            <p style="margin-bottom:16px;font-weight:600;">Will you be my Valentine?</p>

            <div style="display:flex;gap:12px;justify-content:center;">
                <button class="yes-only-btn" id="yesBtn">Yes</button>
                <button class="yes-only-btn" id="noBtn" style="background:#eee;">No</button>
            </div>
        </div>
    </div>

    <!-- SUCCESS VIEW -->
    <div id="successView" class="modal-view">
        <h2>Yay! I can't wait! 💖</h2>
        <div class="success-gif-wrap">
            <img src="giphy.gif" alt="Yes gif"/>
        </div>
        <button class="reset-btn" id="resetBtn">Reset</button>
    </div>

    <!-- NO VIEW -->
    <div id="noView" class="modal-view">
        <h2>Aww... are you sure? 🥺</h2>
        <div class="success-gif-wrap">
            <img src="no-gif.gif" alt="No gif"/>
        </div>
        <p>The YES is still waiting for you 💖</p>
    </div>
</div>

<script>
const envelope = document.getElementById("envelope");
const envelopeStage = document.getElementById("envelopeStage");
const puzzleView = document.getElementById("puzzleView");
const successView = document.getElementById("successView");
const noView = document.getElementById("noView");
const puzzleGrid = document.getElementById("puzzleGrid");
const puzzleRevealText = document.getElementById("puzzleRevealText");
const container = document.querySelector(".container");

envelope.addEventListener("click", ()=>{
    envelope.classList.add("opening");
    setTimeout(()=>{
        envelopeStage.style.display="none";
        document.body.classList.add("show-modal");
        puzzleView.classList.add("visible");
    },300);
});

/* SIMPLE 3x3 PUZZLE (AUTO SOLVE AFTER 3 CLICKS PARA MADALI 😂) */
let clicks = 0;
function renderPuzzle(){
    puzzleGrid.innerHTML="";
    for(let i=0;i<9;i++){
        const tile=document.createElement("div");
        tile.className="puzzle-tile";
        tile.style.backgroundImage=`url('images/tile-${i+1}.png')`;
        tile.onclick=()=>{
            clicks++;
            if(clicks>=3){
                puzzleRevealText.classList.add("show");
            }
        };
        puzzleGrid.appendChild(tile);
    }
}
renderPuzzle();

/* YES */
document.getElementById("yesBtn").addEventListener("click", ()=>{
    puzzleView.classList.remove("visible");
    successView.classList.add("visible");
    runConfettiFor(5000);
});

/* NO */
document.getElementById("noBtn").addEventListener("click", ()=>{
    puzzleView.classList.remove("visible");
    noView.classList.add("visible");

    setTimeout(()=>{
        noView.classList.remove("visible");
        puzzleView.classList.add("visible");
    },3000);
});

/* RESET */
document.getElementById("resetBtn").addEventListener("click", ()=>{
    location.reload();
});

/* CONFETTI */
function runConfettiFor(ms){
    const end=Date.now()+ms;
    (function tick(){
        if(Date.now()<end){
            createConfetti();
            setTimeout(tick,80);
        }
    })();
}
function createConfetti(){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"%";
    c.style.background=["#f093fb","#f5576c","#ffd700","#4facfe","#FFDAE9"][Math.floor(Math.random()*5)];
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3000);
}
</script>

</body>
</html>
