                    <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:#111;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#FFDAE9;
    overflow:auto;
    padding:24px;
}

/* Envelope */
#envelopeStage{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    position:fixed;
    inset:0;
    z-index:10;
}
.envelope{
    width:260px;height:180px;
    background:#f5e6d3;
    border:1px solid #d4c4a8;
    cursor:pointer;
    position:relative;
}
.envelope-flap{
    position:absolute;
    inset:0;
    background:linear-gradient(165deg,#e8d5c4,#c9b89a);
    clip-path:polygon(0 0,50% 50%,100% 0);
    transform-origin:top;
    transition:.8s;
}
.envelope.opening .envelope-flap{
    transform:rotateX(-170deg);
}

/* Modal */
.container{display:none;background:#fff;padding:40px;border-radius:16px;}
body.show-modal .container{display:flex;}
.modal-view{display:none;text-align:center;}
.modal-view.visible{display:block;}

.yes-only-btn{
    font-size:20px;
    padding:12px 24px;
    background:#FFDAE9;
    border:none;
    border-radius:50px;
    cursor:pointer;
    font-weight:600;
    transition:.2s;
}

/* Sad Bounce */
@keyframes bounceSad{
    0%{transform:scale(.5);opacity:0;}
    50%{transform:scale(1.3);}
    70%{transform:scale(.9);}
    100%{transform:scale(1);opacity:1;}
}
.sad-bounce{animation:bounceSad .6s ease;}

/* Confetti */
.confetti{
    position:fixed;
    width:10px;height:10px;
    top:-10px;
    animation:fall 3s linear;
}
@keyframes fall{
    to{transform:translateY(100vh) rotate(360deg);opacity:0;}
}
</style>
</head>

<body>

<!-- Envelope -->
<div id="envelopeStage">
    <div class="envelope" id="envelope">
        <div class="envelope-flap"></div>
    </div>
</div>

<div class="container">
    <div class="modal-inner">

        <!-- Puzzle View (simplified display) -->
        <div id="puzzleView" class="modal-view">
            <h1>Dear Regine...</h1>

            <div class="puzzle-reveal-text" id="puzzleRevealText">
                <p>...you complete me.</p>
                <p><strong>Will you be my Valentine?</strong></p>

                <div id="buttonWrap" style="position:relative;height:100px;display:flex;justify-content:center;align-items:center;">
                    <button class="yes-only-btn" id="yesBtn">Yes</button>
                    <button class="yes-only-btn" id="noBtn" style="position:absolute;">No</button>
                </div>

                <p id="sadMessage" style="display:none;font-size:32px;margin-top:15px;">🥺</p>
            </div>
        </div>

        <!-- Success -->
        <div id="successView" class="modal-view">
            <h2>Yay, I can't wait! 💖</h2>
            <button onclick="location.reload()">Reset</button>
        </div>

    </div>
</div>

<script>
const envelope=document.getElementById("envelope");
const envelopeStage=document.getElementById("envelopeStage");
const puzzleView=document.getElementById("puzzleView");
const successView=document.getElementById("successView");

envelope.addEventListener("click",()=>{
    envelope.classList.add("opening");
    setTimeout(()=>{
        envelopeStage.style.display="none";
        document.body.classList.add("show-modal");
        puzzleView.classList.add("visible");
    },800);
});

/* YES button */
document.getElementById("yesBtn").addEventListener("click",()=>{
    runConfetti();
    puzzleView.classList.remove("visible");
    successView.classList.add("visible");
});

/* 😏 Impossible Mode */
const noBtn=document.getElementById("noBtn");
const yesBtn=document.getElementById("yesBtn");
const sadMessage=document.getElementById("sadMessage");
const buttonWrap=document.getElementById("buttonWrap");

let yesScale=1;

noBtn.addEventListener("click",()=>{
    // 🥺 bounce emoji
    sadMessage.style.display="block";
    sadMessage.classList.remove("sad-bounce");
    void sadMessage.offsetWidth;
    sadMessage.classList.add("sad-bounce");

    // 💖 grow yes button
    yesScale+=0.25;
    yesBtn.style.transform=`scale(${yesScale})`;

    // 😏 move no button randomly
    const rect=buttonWrap.getBoundingClientRect();
    const maxX=rect.width-100;
    const maxY=rect.height-40;

    const randomX=Math.random()*maxX-maxX/2;
    const randomY=Math.random()*maxY-maxY/2;

    noBtn.style.transform=`translate(${randomX}px,${randomY}px)`;
});

/* Confetti */
function runConfetti(){
    for(let i=0;i<100;i++){
        setTimeout(()=>{
            const c=document.createElement("div");
            c.className="confetti";
            c.style.left=Math.random()*100+"%";
            c.style.background=["#f093fb","#f5576c","#ffd700","#4facfe"][Math.floor(Math.random()*4)];
            document.body.appendChild(c);
            setTimeout(()=>c.remove(),3000);
        },i*30);
    }
}
</script>

</body>
</html>
